<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Csillagösvény generátor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
    :root { --gold-medium: #cbb180; --gold-bright: #ebd2a9; --bg-dark: #030712; }
    body { font-family: 'Cormorant Garamond', serif; background: var(--bg-dark); color: #f7edd8; padding: 20px; }
    .gen-panel { max-width: 500px; margin: auto; border: 1px solid var(--gold-medium); padding: 20px; background: rgba(18, 44, 94, 0.15); }
    h2 { text-align: center; color: var(--gold-bright); margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; font-size: 18px; }
    label { display: block; color: var(--gold-medium); margin: 10px 0 3px; text-transform: uppercase; font-size: 10px; }
    input, textarea { width: 100%; padding: 8px; background: #030712; border: 1px solid var(--gold-medium); color: white; margin-bottom: 5px; font-family: 'Cormorant Garamond', serif; font-size: 14px; }
    button { width: 100%; padding: 10px; background: var(--gold-medium); border: none; cursor: pointer; font-weight: bold; margin-top: 10px; text-transform: uppercase; }
    #output { height: 100px; font-family: monospace; font-size: 10px; background: #000; }
</style>
</head>
<body>

<div class="gen-panel">
    <h2>✦ Csillagösvény generátor ✦</h2>
    <label>From:</label> <input type="text" id="target" value="William Ashford">
    <label>Cím:</label> <input type="text" id="title" value="Elveszett szálak">
    <label>Szöveg:</label> <textarea id="maintext" style="height: 80px;">Ide írd a válaszod...</textarea>
    <label>Jegyzet1:</label> <input type="text" id="noteBL" value="A parázs kihűl">
    <label>Jegyzet2:</label> <input type="text" id="noteTR" value="Mars retrográd.">
    <label>Rövid jóslat:</label> <input type="text" id="footerOmen" value="a csillagok nem felejtenek">
    <button onclick="generateFullCode()">Kód generálása</button>
    <textarea id="output" readonly></textarea>
    <button onclick="copyCode()">Kód másolása</button>
</div>

<script>
function generateFullCode() {
    const t = document.getElementById('target').value;
    const ti = document.getElementById('title').value;
    const mt = document.getElementById('maintext').value;
    const nBL = document.getElementById('noteBL').value;
    const nTR = document.getElementById('noteTR').value;
    const fO = document.getElementById('footerOmen').value;

    const code = `[html]
<div style="width:400px; margin:20px auto; background:radial-gradient(circle at 30% 15%, rgba(18, 44, 94, 0.3) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255, 215, 150, 0.02) 0%, transparent 40%), #030712; border:1px solid rgba(203, 177, 128, 0.25); position:relative; padding:40px 20px 20px 20px; box-sizing:border-box; box-shadow:inset 0 0 40px rgba(0,0,0,0.9); font-family:'Cormorant Garamond', serif; color:#ebd2a9;">
    
    <div style="position:absolute; bottom:15px; left:15px; font-size:9px; font-style:italic; color:rgba(203, 177, 128, 0.3); line-height:1;">${nBL}</div>
    <div style="position:absolute; top:15px; right:15px; font-size:9px; font-style:italic; color:rgba(203, 177, 128, 0.3); text-align:right;">${nTR}</div>

    <div style="border-bottom:1px solid rgba(203, 177, 128, 0.15); padding-bottom:5px; margin-bottom:15px; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#cbb180; text-align:left;">✦ From: ${t}</div>

    <div style="border:1px solid rgba(203, 177, 128, 0.12); padding:15px; background:linear-gradient(180deg, rgba(5, 15, 36, 0.2) 0%, rgba(2, 5, 13, 0.4) 100%); overflow-y:auto; height:300px; box-sizing:border-box;">
        <h2 style="text-align:center; font-size:16px; font-weight:400; letter-spacing:1px; margin-bottom:15px; color:#ebd2a9; text-transform:uppercase;">${ti}</h2>
        <p style="font-size:14px; line-height:1.6; color:rgba(247, 237, 216, 0.95); text-align:justify; margin:0;">
            ${mt.replace(/\n/g, '<br>')}
        </p>
    </div>

    <div style="margin-top:15px; text-align:center; font-style:italic; color:#cbb180; font-size:12px; letter-spacing:1px;">"${fO}"</div>
</div>
[/html]`;
    document.getElementById('output').value = code;
}

function copyCode() {
    const c = document.getElementById("output");
    c.select();
    document.execCommand("copy");
    alert("Kód másolva!");
}
</script>
</body>
</html>
