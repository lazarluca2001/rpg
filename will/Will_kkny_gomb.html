<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>William Ashford - gomb</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
    :root {
        --gold-medium: #cbb180;
        --gold-bright: #ebd2a9;
        --bg-dark: #030712;
    }

    body {
        font-family: 'Cormorant Garamond', serif;
        background: var(--bg-dark);
        color: #f7edd8;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden; /* Prevent body scrolling if nebula goes crazy */
    }

    /* --- STAR DUST NEBULA BACKGROUND EFFECT --- */
    .nebula-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 15%, rgba(18, 44, 94, 0.4) 0%, transparent 60%),
                    radial-gradient(circle at 85% 75%, rgba(255, 215, 150, 0.05) 0%, transparent 50%),
                    var(--bg-dark);
        opacity: 0.8;
        pointer-events: none;
        z-index: -1;
    }

    /* --- PREMIUM ASTRAL NAVIGATION BUTTON --- */
    .astral-nav-button {
        display: inline-block;
        width: 100%;
        max-width: 420px; /* Matched to 400px logic, slightly wider for padding */
        height: auto;
        padding: 25px 35px; /* Generous internal space */
        background: linear-gradient(180deg, rgba(5, 15, 36, 0.8) 0%, rgba(2, 5, 13, 1) 100%);
        border: 1px solid rgba(203, 177, 128, 0.2);
        box-sizing: border-box;
        box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.9);
        position: relative;
        overflow: visible;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.4s ease-in-out;
    }

    /* Outer Ornate Border & Icons */
    .astral-nav-button .outer-elements {
        position: absolute;
        inset: -8px; /* Offset the border elements outward */
        pointer-events: none;
        z-index: 10;
    }

    /* Multi-layered border base */
    .astral-nav-button .outer-elements::before {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid rgba(203, 177, 128, 0.15); /* Halvány arany alapkeret */
    }

    /* Intricate etched pattern réteg */
    .astral-nav-button .outer-elements::after {
        content: '';
        position: absolute;
        inset: 4px; /* Inner frame within etched patterns */
        border: 1.2px solid rgba(203, 177, 128, 0.15); /* Cleaner inner line */
    }

    /* Icon elements (Quill and Telescope) */
    .astral-nav-button .outer-elements .icon {
        position: absolute;
        width: 32px;
        height: 32px;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        filter: drop-shadow(0 0 4px rgba(235, 210, 169, 0.4));
        transition: 0.3s;
    }

    .astral-nav-button .outer-elements .icon.quill {
        bottom: 8px; /* Place inside etched border area */
        left: 10px;
        /* Replace with your quill-star SVG or icon path */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23ebd2a9"><path d="M78 12c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4 1.8-4 4-4-1.8-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm10 8c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3zM32 91c-.3-.2-.5-.5-.7-.8L22 66l-5.6-7c-1.2-1.5-2.2-3.1-3.1-4.7L6 34c-1.6-3.2-1.7-6.9.1-9.9L16 9l7-6 12-3s10 0 15 5 10 10 15 15l20 20s6.7 13.3 10 20c2.8 5.7.9 12.6-4.5 16L80 82s-10 0-15 5c-3.1 3.1-4.7 6.3-5.6 9l-4.7 5.6zM24 64l7.6 19.1c.2.5.5 1 .8 1.4L44 91l5.6-7c1.3-1.6 2.4-3.3 3.3-5.1L64 56l9.1-7.6c.5-.4 1-.9 1.4-1.4l7.6-9.1s3.1-6.2 3.1-10c.1-1-.2-2-.9-2.7l-9.1-7.6c-1.2-1-2.6-1.5-4.1-1.5z"/></svg>');
    }

    .astral-nav-button .outer-elements .icon.telescope {
        top: 8px; /* Place inside etched border area */
        right: 10px;
        /* Replace with your telescope-on-tripod SVG or icon path */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23ebd2a9"><path d="M91.4 34c1-.8 1.2-2.3.4-3.3l-5-6c-.8-1-2.3-1.2-3.3-.4l-2 1.6-2 1.6-60 48c-.4.3-.6.6-.7.9L16.2 88c-.6 2.3 1.1 4.5 3.5 4L34 85.8l10.2-2L91.4 34zM19.2 88l-2.1-.5.3-2 2-.3s.2-.1.3-.2l1.3.3zM28 85.8l-1.3-.3s.3-.3.4-.3l1-.2 1.3-.3s0 .2-.1.3l-.2 1zM78 12c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4 1.8-4 4-4-1.8-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM32 91c-.3-.2-.5-.5-.7-.8L22 66l-5.6-7c-1.2-1.5-2.2-3.1-3.1-4.7L6 34c-1.6-3.2-1.7-6.9.1-9.9L16 9l7-6 12-3s10 0 15 5 10 10 15 15l20 20s6.7 13.3 10 20c2.8 5.7.9 12.6-4.5 16L80 82s-10 0-15 5c-3.1 3.1-4.7 6.3-5.6 9l-4.7 5.6zM24 64l7.6 19.1c.2.5.5 1 .8 1.4L44 91l5.6-7c1.3-1.6 2.4-3.3 3.3-5.1L64 56l9.1-7.6c.5-.4 1-.9 1.4-1.4l7.6-9.1s3.1-6.2 3.1-10c.1-1-.2-2-.9-2.7l-9.1-7.6c-1.2-1-2.6-1.5-4.1-1.5z"/></svg>');
    }

    /* Text elements - Stacking "VÁLASZOLJ STÍLUSSAN" */
    .astral-nav-button .button-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 15; /* Above background elements */
    }

    .astral-nav-button .button-content span {
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--gold-bright);
        line-height: 1.2;
        font-weight: 500;
        transition: 0.3s;
    }

    /* Main "VÁLASZOLJ" line */
    .astral-nav-button .button-content .line-1 {
        font-size: 26px; /* Matched to prominent serif font from image */
        filter: drop-shadow(0 0 8px rgba(235, 210, 169, 0.4)); /* Halvány arany fény */
    }

    /* Sub "STÍLUSSAN" line */
    .astral-nav-button .button-content .line-2 {
        font-size: 16px; /* Subtle sub-line */
        color: var(--gold-medium); /* Halványabb arany */
        letter-spacing: 2.5px;
    }

    /* --- GOMB KÜLSŐSÉGEK: HOVER ÉS INTERAKCIÓK --- */
    .astral-nav-button:hover {
        transform: translateY(-5px); /* Enyhe emelkedés */
        box-shadow: 0 20px 60px rgba(0,0,0,0.95), inset 0 0 40px rgba(0,0,0,1);
        border-color: rgba(235, 210, 169, 0.4); /* Fényesedő szegély */
    }

    /* Text & Icon activation on hover */
    .astral-nav-button:hover .button-content .line-1 {
        color: #fff; /* Fényesfehér aktiválás */
        filter: drop-shadow(0 0 12px rgba(235, 210, 169, 0.6));
    }

    .astral-nav-button:hover .button-content .line-2 {
        color: var(--gold-bright); /* Halványaranyról világos aranyra */
    }

    .astral-nav-button:hover .outer-elements .icon {
        transform: scale(1.1); /* Icons grow on hover */
        filter: drop-shadow(0 0 8px rgba(235, 210, 169, 0.7));
    }

    /* Halvány belső villogás hatás hoverre */
    .astral-nav-button::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(18, 44, 94, 0.4) 0%, transparent 60%);
        opacity: 0;
        z-index: 1;
        transition: 0.5s;
    }

    .astral-nav-button:hover::before {
        opacity: 1; /* Villogás megjelenítése */
    }

</style>
</head>
<body>

    <div class="nebula-bg"></div>

    <a href="URL_A_GENERÁTORHOZ" class="astral-nav-button" target="_blank">
        
        <div class="outer-elements">
            <div class="icon quill"></div>
            <div class="icon telescope"></div>
        </div>

        <div class="button-content">
            <span class="line-1">VÁLASZOLJ</span>
            <span class="line-2">STÍLUSSAN</span>
        </div>
    </a>

</body>
</html>
